# App web (público). Dorme sem acesso e acorda na primeira requisição.
app = "nexo-assist-web"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  build-target = "web"

[env]
  APP_DATABASE_URL = "file:/data/app.db"
  TICKETS_API_URL = "http://nexo-assist-tickets.internal:4000"
  LLM_MODEL = "anthropic/claude-haiku-5-5"
  MAX_MESSAGES_PER_SESSION = "30"
  USER_DAILY_TURN_LIMIT = "60"
  DAILY_TURN_LIMIT = "1000"

[mounts]
  source = "web_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
