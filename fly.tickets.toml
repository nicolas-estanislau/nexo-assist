# Serviço de chamados ("legado" simulado). Só tem IP privado (Flycast): não tem endereço
# público e só é alcançado pelo app web, em http://<app>.flycast. Fica sempre ligado, como
# um sistema legado: acordar leva ~15 s, mais do que o login espera. Se a máquina parar
# mesmo assim, o proxy do Fly a religa na próxima chamada.
app = "nexo-assist-tickets"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  build-target = "tickets"

[env]
  TICKETS_API_PORT = "4000"
  TICKETS_DATABASE_URL = "file:/data/tickets.db"
  TICKETS_FAILURE_RATE = "0.05"
  TICKETS_OUTAGE_SECONDS = "3"
  TICKETS_LATENCY_MS = "150"

[mounts]
  source = "tickets_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
